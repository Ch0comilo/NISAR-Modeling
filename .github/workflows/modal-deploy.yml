name: Deploy to Modal

# Every push to main re-runs the science checks and, if they pass, deploys the explorer to the
# production Modal app. Needs the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (an API
# token of the ch0comilo workspace). The existing nisar-evidence-api app is never touched: this
# workflow deploys under its own resource names.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments share the job-state Dict, so they queue instead of overlapping or being cancelled.
concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/science-tests.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      NISAR_APP_NAME: nisar-hazard-watch-ml
      NISAR_VOLUME: nisar-hazard-watch-chip-cache
      NISAR_EARTHDATA_SECRET: nisar-hazard-watch-earthdata
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the Modal credentials
        shell: bash
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error title=Modal credentials missing::Add the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (an API token of the ch0comilo workspace)."
            exit 1
          fi
      - name: Install the Modal client
        run: python -m pip install modal==1.6.4
      - name: Build and deploy
        run: python -m modal deploy --env main modal_app.py
      - name: Verify the deployment
        shell: bash
        run: |
          url=$(python -c 'import os, modal; print(modal.Function.from_name(os.environ["NISAR_APP_NAME"], "api", environment_name="main").get_web_url())')
          echo "Gateway: $url"
          body=""
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 60 "$url/health") && break
            sleep 10
          done
          test -n "$body" || { echo "::error::$url/health did not answer"; exit 1; }
          echo "$body"
          python -c 'import json, sys; h = json.loads(sys.argv[1]); assert h["status"] == "ok", h; assert h["git_sha"] == sys.argv[2], (h["git_sha"], sys.argv[2])' "$body" "$GITHUB_SHA"
          {
            echo "### Deployed to Modal"
            echo "- App \`$NISAR_APP_NAME\`: $url"
            echo "- Commit \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
