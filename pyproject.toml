[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-surface-dynamics"
version = "0.5.0"
description = "Worldwide, capability-aware descriptive SAR surface dynamics; science artifacts only"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "scipy>=1.15", "xarray>=2025.4", "h5py>=3.12", "h5netcdf", "rasterio>=1.4", "requests", "urllib3>=2.0", "matplotlib", "torch>=2.6", "jsonschema", "Pillow"]

[project.optional-dependencies]
exploration = ["umap-learn==0.5.12", "scikit-learn>=1.6", "plotly>=6"]

[project.scripts]
surface-dynamics = "surface_dynamics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surface_dynamics = ["schemas/*.json"]
